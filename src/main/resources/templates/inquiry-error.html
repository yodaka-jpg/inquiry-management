<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>問い合わせエラー</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f5f5f5;
            color: #333333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;
        }

        .error-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 32px;
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 8px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .error-message {
            margin: 24px 0;
            padding: 16px;
            border: 1px solid #d32f2f;
            border-radius: 4px;
            background-color: #ffebee;
            color: #d32f2f;
        }

        .button-area {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 4px;
            background-color: #1976d2;
            color: #ffffff;
            text-decoration: none;
        }

        .button:hover {
            background-color: #125aa0;
        }

        .logout-form {
            margin: 0;
        }

        .logout-button {
            padding: 10px 16px;
            border: 1px solid #777777;
            border-radius: 4px;
            background-color: #ffffff;
            color: #333333;
            cursor: pointer;
        }
    </style>
</head>

<body>
<main class="error-container">
    <h1>問い合わせを表示できません</h1>

    <div class="error-message"
         th:text="${errorMessage}">
        指定された問い合わせは存在しません。
    </div>

    <div class="button-area">
        <a class="button"
           th:href="@{/}">
            ホームへ戻る
        </a>

        <form class="logout-form"
              th:action="@{/logout}"
              method="post">
            <button class="logout-button"
                    type="submit">
                ログアウト
            </button>
        </form>
    </div>
</main>
</body>
</html>
